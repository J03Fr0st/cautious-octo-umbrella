services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: family_tree
      POSTGRES_PASSWORD: family_tree
      POSTGRES_DB: family_tree
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree -d family_tree"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
